<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkBoard · Gäste-WLAN</title>
<style>
  :root { color-scheme: light dark; --bg:#eceef6; --card:rgba(255,255,255,.78); --border:rgba(38,40,56,.10); --text:#262838; --sub:#5f6480; --accent:#d9824f; --grad:linear-gradient(135deg,#cf7a45,#a9512a); --input:rgba(38,40,56,.06); --ok:#257a44; --err:#b53f31; }
  @media (prefers-color-scheme: dark) { :root { --bg:#191b26; --card:rgba(37,40,56,.78); --border:rgba(255,255,255,.10); --text:#e9eaf2; --sub:#a9aec9; --accent:#e59a63; --input:rgba(255,255,255,.07); --ok:#6fcf97; --err:#e08a8a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:18px 16px 40px; }
  h1 { font-size:22px; margin:6px 4px 2px; }
  h2 { font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--sub); margin:0 0 10px; }
  .sub { color:var(--sub); font-size:13px; margin:0 4px 14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:22px; padding:16px; margin-bottom:14px; box-shadow:0 10px 30px rgba(90,99,140,.10); }
  .state { display:flex; align-items:center; gap:10px; font-size:18px; font-weight:600; margin-bottom:12px; }
  .dot { width:12px; height:12px; border-radius:6px; background:var(--sub); flex:none; }
  .on .dot { background:var(--ok); }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  button { font-size:16px; border:0; border-radius:14px; padding:13px 10px; color:#fff; background:var(--grad); font-weight:600; }
  button.alt { background:var(--input); color:var(--text); }
  button.stop { background:var(--input); color:var(--err); }
  input[type=text], textarea { width:100%; font-size:16px; padding:12px 14px; border-radius:14px; border:1px solid var(--border); background:var(--input); color:var(--text); font-family:inherit; }
  textarea { min-height:140px; resize:vertical; }
  label { display:block; font-size:13px; color:var(--sub); margin:12px 2px 6px; }
  .save { width:100%; margin-top:14px; }
  .hint { font-size:13px; color:var(--sub); margin:8px 2px 0; }
  #msg { margin:8px 4px 0; font-size:13px; color:var(--err); min-height:16px; }
</style>
</head>
<body>
<main>
  <h1 id="h1">Gäste-WLAN</h1>
  <p class="sub" id="sub">&nbsp;</p>
  <div class="card" id="c1">
    <h2 id="h2a"></h2>
    <div class="state" id="state"><span class="dot"></span><span id="st"></span></div>
    <div class="grid" id="btns"></div>
    <button class="stop save" id="stop" type="button"></button>
    <p class="hint" id="note"></p>
  </div>
  <div class="card">
    <h2 id="h2b"></h2>
    <label id="lw" for="w"></label>
    <input type="text" id="w" maxlength="80" autocomplete="off">
    <label id="lr" for="r"></label>
    <textarea id="r" maxlength="500"></textarea>
    <button class="save" id="save" type="button"></button>
  </div>
  <div class="hint" id="sync"></div>
  <div id="msg"></div>
</main>
<script>
(function () {
  var en = (navigator.language || "de").slice(0, 2) === "en";
  var L = en ? { h: "Guest Wi-Fi", st: "Guest mode", on: "on", off: "off", always: "permanent (app setting)", left: "left", start: "Start guest mode for", d1: "1 day", d3: "3 days", d7: "1 week", d14: "2 weeks", stop: "End guest mode", h2b: "Welcome text and house rules", lw: "Welcome text (on the display)", lr: "House rules, one per line (up to 6)", save: "Save", saved: "Saved", busy: "Device busy, retrying…", fail: "No connection to the InkBoard", ok: "synced with the network", local: "not synced (no external storage)", error: "sync error - will retry", nossid: "Enter the Wi-Fi name and password in the app settings first.", clock: "Clock not set yet", d: "d", hh: "h", mm: "min" }
               : { h: "Gäste-WLAN", st: "Gast-Modus", on: "an", off: "aus", always: "dauerhaft (App-Einstellung)", left: "noch", start: "Gast-Modus starten für", d1: "1 Tag", d3: "3 Tage", d7: "1 Woche", d14: "2 Wochen", stop: "Gast-Modus beenden", h2b: "Willkommenstext und Hausregeln", lw: "Willkommenstext (auf dem Display)", lr: "Hausregeln, eine pro Zeile (bis 6)", save: "Speichern", saved: "Gespeichert", busy: "Gerät beschäftigt, neuer Versuch…", fail: "Keine Verbindung zum InkBoard", ok: "mit dem Netzwerk synchronisiert", local: "nicht synchronisiert (kein externer Speicher)", error: "Sync-Fehler, wird wiederholt", nossid: "Trage zuerst WLAN-Name und Passwort in den App-Einstellungen ein.", clock: "Uhr noch nicht gestellt", d: "T", hh: "Std", mm: "Min" };
  var $ = function (id) { return document.getElementById(id); };
  $("h1").textContent = L.h; $("h2a").textContent = L.st; $("h2b").textContent = L.h2b; $("lw").textContent = L.lw; $("lr").textContent = L.lr;
  $("save").textContent = L.save; $("stop").textContent = L.stop;
  var wired = false, editing = false;
  function api(body, retry) {
    return fetch(location.pathname.replace(/\/+$/, "") + "/api", { method: "POST", headers: { "X-Requested-With": "XMLHttpRequest", "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) {
        if (r.status === 503 && (retry || 0) < 6) { $("msg").textContent = L.busy; return new Promise(function (res) { setTimeout(res, 1200); }).then(function () { return api(body, (retry || 0) + 1); }); }
        if (!r.ok) throw new Error(r.status);
        return r.json();
      });
  }
  function leftText(s) {
    if (s < 0) return "";
    var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    return L.left + " " + (d ? d + " " + L.d + " " : "") + (h ? h + " " + L.hh + " " : "") + (!d ? m + " " + L.mm : "");
  }
  function render(d) {
    $("msg").textContent = "";
    $("c1").className = "card" + (d.active ? " on" : "");
    $("state").className = "state" + (d.active ? " on" : "");
    $("st").textContent = L.st + " " + (d.active ? L.on : L.off) + (d.always ? " · " + L.always : (d.active ? " · " + leftText(d.left) : ""));
    $("sub").textContent = d.ssid || "";
    $("note").textContent = d.ssid ? "" : L.nossid;
    $("stop").hidden = !d.active || d.always;
    if (!wired) {
      wired = true;
      [[24, L.d1], [72, L.d3], [168, L.d7], [336, L.d14]].forEach(function (x) {
        var b = document.createElement("button"); b.type = "button"; b.className = "alt"; b.textContent = L.start + " " + x[1];
        b.onclick = function () { act({ op: "start", hours: x[0] }); };
        $("btns").appendChild(b);
      });
    }
    if (!editing) { $("w").value = d.welcome || ""; $("r").value = (d.rules || []).join("\n"); }
    $("sync").textContent = L[d.sync] || "";
  }
  function act(body) { return api(body).then(render).catch(function () { $("msg").textContent = L.fail; }); }
  $("stop").onclick = function () { act({ op: "stop" }); };
  $("w").oninput = $("r").oninput = function () { editing = true; };
  $("save").onclick = function () {
    var rules = $("r").value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 6);
    editing = false;
    act({ op: "set", welcome: $("w").value.trim(), rules: rules }).then(function () { $("msg").style.color = "var(--ok)"; $("msg").textContent = L.saved; setTimeout(function () { $("msg").textContent = ""; $("msg").style.color = ""; }, 2500); });
  };
  act({ op: "list" });
  setInterval(function () { if (!document.hidden && !editing) api({ op: "list" }).then(render).catch(function () {}); }, 8000);
})();
</script>
</body>
</html>
