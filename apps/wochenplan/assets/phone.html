<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkBoard · Wochenplan</title>
<style>
  :root { color-scheme: light dark; --bg:#eceef6; --card:rgba(255,255,255,.78); --border:rgba(38,40,56,.10); --text:#262838; --sub:#5f6480; --accent:#d9824f; --grad:linear-gradient(135deg,#cf7a45,#a9512a); --input:rgba(38,40,56,.06); --ok:#257a44; --err:#b53f31; }
  @media (prefers-color-scheme: dark) { :root { --bg:#191b26; --card:rgba(37,40,56,.78); --border:rgba(255,255,255,.10); --text:#e9eaf2; --sub:#a9aec9; --accent:#e59a63; --input:rgba(255,255,255,.07); --ok:#6fcf97; --err:#e08a8a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:18px 16px 40px; }
  h1 { font-size:22px; margin:6px 4px 2px; }
  .sub { color:var(--sub); font-size:13px; margin:0 4px 14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:22px; padding:12px; box-shadow:0 10px 30px rgba(90,99,140,.10); }
  form { display:flex; gap:8px; margin-bottom:12px; }
  input[type=text] { flex:1; min-width:0; font-size:17px; padding:13px 14px; border-radius:14px; border:1px solid var(--border); background:var(--input); color:var(--text); }
  button { font-size:16px; border:0; border-radius:14px; padding:0 18px; color:#fff; background:var(--grad); font-weight:600; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:12px; padding:12px 6px; border-top:1px solid var(--border); font-size:17px; }
  li:first-child { border-top:0; }
  li .t { flex:1; word-break:break-word; }
  li.done .t { text-decoration:line-through; color:var(--sub); }
  .box { width:28px; height:28px; border-radius:8px; border:2px solid var(--sub); flex:none; display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff; }
  li.done .box { background:var(--ok); border-color:var(--ok); }
  .x { background:none; color:var(--sub); font-size:22px; padding:0 8px; font-weight:400; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin:12px 4px 0; font-size:13px; color:var(--sub); }
  .bar button { background:none; color:var(--accent); padding:6px 4px; font-size:14px; }
  .empty { text-align:center; color:var(--sub); padding:26px 0; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; padding:10px 0; font-size:15px; background:var(--input); color:var(--text); border-radius:12px; }
  .tabs button.on { background:var(--grad); color:#fff; }
  .tabs button.today:not(.on) { outline:2px solid var(--accent); }
  .tabs .c { display:block; font-size:11px; opacity:.7; font-weight:400; }
  .weekbar { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .weekbar button { background:var(--input); color:var(--text); border-radius:12px; padding:0; width:42px; height:42px; font-size:20px; font-weight:500; flex:none; }
  .weekbar .wk { flex:1; text-align:center; background:none; color:var(--text); font-size:15px; font-weight:600; height:42px; line-height:1.2; }
  .weekbar .wk small { display:block; font-size:12px; font-weight:400; color:var(--sub); }
  .scope { display:flex; gap:6px; margin-bottom:12px; }
  .scope button { flex:1; padding:9px 0; font-size:14px; background:var(--input); color:var(--text); border-radius:12px; font-weight:500; }
  .scope button.on { background:var(--grad); color:#fff; font-weight:600; }
  .rec { display:inline-block; margin-right:6px; color:var(--sub); font-size:14px; }
  .who { width:34%; flex:none !important; }
  .pp { display:inline-block; padding:1px 8px; border-radius:10px; background:var(--input); font-size:13px; margin-right:8px; color:var(--sub); }
  #msg { margin:8px 4px 0; font-size:13px; color:var(--err); min-height:16px; }
</style>
</head>
<body>
<main>
  <h1 id="h1">Wochenplan</h1>
  <p class="sub" id="sub">&nbsp;</p>
  <div class="card">
    <div class="weekbar"><button type="button" id="wprev" aria-label="Previous week">&#8249;</button><button type="button" class="wk" id="wtitle"></button><button type="button" id="wnext" aria-label="Next week">&#8250;</button></div>
    <div class="scope" id="scope"></div>
    <div class="tabs" id="tabs"></div>
    <form id="f"><input type="text" id="who" class="who" maxlength="12" list="pl" placeholder="Person" autocomplete="off"><datalist id="pl"></datalist><input type="text" id="in" maxlength="50" placeholder="Was steht an?" autocomplete="off" enterkeyhint="done"><button type="submit" id="add">+</button></form>
    <ul id="list"></ul>
    <div class="empty" id="empty" hidden>Nichts geplant.</div>
  </div>
  <div class="bar"><span id="sync"></span></div>
  <div id="msg"></div>
</main>
<script>
(function () {
  var en = (navigator.language || "de").slice(0, 2) === "en";
  var D = en ? ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"] : ["Mo","Di","Mi","Do","Fr","Sa","So"];
  var DL = en ? ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"] : ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
  var L = en ? { h: "Weekly plan", who: "Person", ph: "What is planned?", empty: "Nothing planned.", ok: "synced with the network", local: "not synced (no external storage)", error: "sync error - will retry", busy: "Device busy, retrying…", fail: "No connection to the InkBoard", rep: "repeats every week", every: "Every week", only: "Only week {w}", wk: "Week", back: "Tap: this week", one: "this week only" }
               : { h: "Wochenplan", who: "Person", ph: "Was steht an?", empty: "Nichts geplant.", ok: "mit dem Netzwerk synchronisiert", local: "nicht synchronisiert (kein externer Speicher)", error: "Sync-Fehler, wird wiederholt", busy: "Gerät beschäftigt, neuer Versuch…", fail: "Keine Verbindung zum InkBoard", rep: "wiederholt sich jede Woche", every: "Jede Woche", only: "Nur KW {w}", wk: "KW", back: "Tippen: diese Woche", one: "nur diese Woche" };
  var $ = function (id) { return document.getElementById(id); };
  $("h1").textContent = L.h; $("who").placeholder = L.who; $("in").placeholder = L.ph; $("empty").textContent = L.empty;
  var data = { items: [], persons: [], today: 0, sync: "local" };
  var sel = 0, off = 0, scope = "all";
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  // Montag der gewaehlten Woche (Ortszeit des Handys) und ISO-Schluessel Jahr*100+KW (wie in der Firmware)
  function monday() { var d = new Date(); d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7) + 7 * off); return d; }
  function isoKey(d) {
    var u = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    u.setUTCDate(u.getUTCDate() - ((u.getUTCDay() + 6) % 7) + 3);
    var y = u.getUTCFullYear(), f = new Date(Date.UTC(y, 0, 4));
    return { y: y, w: 1 + Math.round(((u - f) / 864e5 - 3 + ((f.getUTCDay() + 6) % 7)) / 7) };
  }
  function wkKey() { var k = isoKey(monday()); return k.y * 100 + k.w; }
  function dayDate(i) { var m = monday(); return new Date(m.getFullYear(), m.getMonth(), m.getDate() + i - 1); }
  function fmt(d) { return d.getDate() + "." + (d.getMonth() + 1) + "."; }
  function api(body, retry) {
    return fetch(location.pathname.replace(/\/+$/, "") + "/api", { method: "POST", headers: { "X-Requested-With": "XMLHttpRequest", "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) {
        if (r.status === 503 && (retry || 0) < 6) { $("msg").textContent = L.busy; return new Promise(function (res) { setTimeout(res, 1200); }).then(function () { return api(body, (retry || 0) + 1); }); }
        if (!r.ok) throw new Error(r.status);
        return r.json();
      });
  }
  function render(d) {
    data = d; $("msg").textContent = "";
    if (!sel) sel = d.today || 1;
    var key = wkKey();
    var inWeek = function (x) { return x.wk === 0 || x.wk === key; };
    var k = isoKey(monday());
    $("wtitle").innerHTML = L.wk + " " + k.w + "<small>" + fmt(dayDate(1)) + " – " + fmt(dayDate(7)) + (off === 0 ? "" : " · " + L.back) + "</small>";
    var sc = $("scope"); sc.innerHTML = "";
    [["all", L.every], ["week", L.only.replace("{w}", k.w)]].forEach(function (o) {
      var b = document.createElement("button"); b.type = "button"; b.className = scope === o[0] ? "on" : ""; b.textContent = o[1];
      b.onclick = function () { scope = o[0]; render(data); };
      sc.appendChild(b);
    });
    var tabs = $("tabs"); tabs.innerHTML = "";
    for (var i = 1; i <= 7; i++) (function (i) {
      var n = d.items.filter(function (x) { return x.day === i && inWeek(x); }).length;
      var b = document.createElement("button"); b.type = "button";
      b.className = (i === sel ? "on " : "") + (i === d.today && off === 0 ? "today" : "");
      b.innerHTML = D[i - 1] + '<span class="c">' + dayDate(i).getDate() + '.</span><span class="c">' + (n || "&nbsp;") + "</span>";
      b.onclick = function () { sel = i; render(data); };
      tabs.appendChild(b);
    })(i);
    var ul = $("list"); ul.innerHTML = "";
    var rows = d.items.filter(function (x) { return x.day === sel && inWeek(x); });
    rows.forEach(function (it) {
      var li = document.createElement("li");
      var t = document.createElement("div"); t.className = "t";
      if (it.wk === 0) { var r = document.createElement("span"); r.className = "rec"; r.textContent = "\u21bb"; r.title = L.rep; t.appendChild(r); }
      if (it.person) { var p = document.createElement("span"); p.className = "pp"; p.textContent = it.person; t.appendChild(p); }
      t.appendChild(document.createTextNode(it.text));
      var x = document.createElement("button"); x.className = "x"; x.type = "button"; x.textContent = "\u00d7"; x.setAttribute("aria-label", "Delete");
      x.onclick = function () { act({ op: "del", id: it.id }); };
      li.appendChild(t); li.appendChild(x); ul.appendChild(li);
    });
    $("empty").hidden = rows.length > 0;
    $("sub").textContent = DL[sel - 1] + ", " + fmt(dayDate(sel)) + " · " + (scope === "week" ? L.one : L.rep);
    var pl = $("pl"); pl.innerHTML = "";
    d.persons.forEach(function (p) { var o = document.createElement("option"); o.value = p; pl.appendChild(o); });
    $("sync").textContent = L[d.sync] || "";
  }
  function act(body) { return api(body).then(render).catch(function () { $("msg").textContent = L.fail; }); }
  $("f").onsubmit = function (e) {
    e.preventDefault();
    var v = $("in").value.trim(); if (!v) return;
    var who = $("who").value.trim();
    $("in").value = "";
    act({ op: "add", day: sel, person: who, text: v, wk: scope === "week" ? wkKey() : 0 });
  };
  function nav(n) { off += n; scope = "week"; render(data); }
  $("wprev").onclick = function () { nav(-1); };
  $("wnext").onclick = function () { nav(1); };
  $("wtitle").onclick = function () { if (off !== 0) { off = 0; sel = data.today || sel; render(data); } };
  act({ op: "list" });
  setInterval(function () { if (!document.hidden) api({ op: "list" }).then(render).catch(function () {}); }, 8000);
})();
</script>
</body>
</html>
