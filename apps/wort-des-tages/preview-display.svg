<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480"><rect width="800" height="480" fill="#f6f4ee"/><rect width="800" height="14" fill="#3f6fbf"/><text x="40" y="60" font-family="Helvetica,Arial,sans-serif" font-size="22" letter-spacing="3" fill="#3f6fbf">WORT DES TAGES</text><text x="40" y="170" font-family="Helvetica,Arial,sans-serif" font-weight="800" font-size="84" fill="#1c1b18">serendipity</text><rect x="40" y="198" width="720" height="3" fill="#3f6fbf"/><g font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#1c1b18"><text x="40" y="262">the faculty of finding valuable or</text><text x="40" y="304">agreeable things not sought for</text></g><text x="40" y="400" font-family="Helvetica,Arial,sans-serif" font-size="24" font-style="italic" fill="#5f6480">"Meeting her was pure serendipity."</text></svg>
